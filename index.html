
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>GRAND FINAL OLYMPIAD MEDSPIN 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --navy: #101827;
      --panel: #1b2940;
      --gold: #e8c779;
      --white: #ffffff;
      --muted: #aab5c5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #263955 0%, var(--navy) 65%);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .screen {
      width: 100%;
      max-width: 1500px;
      text-align: center;
    }

    .eyebrow {
      color: var(--gold);
      font-size: clamp(15px, 2vw, 25px);
      font-weight: 800;
      letter-spacing: 0.28em;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 66px);
      line-height: 1.12;
      font-weight: 900;
      letter-spacing: 0.035em;
    }

    .divider {
      width: 120px;
      height: 4px;
      margin: 24px auto;
      background: var(--gold);
      border-radius: 10px;
    }

    .round {
      display: inline-block;
      padding: 9px 24px;
      border: 1px solid var(--gold);
      border-radius: 30px;
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 0.15em;
      margin-bottom: 34px;
    }

    .teams {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(6px, 1.6vw, 22px);
    }

    .team {
      background: linear-gradient(180deg, #22334d, #172337);
      border: 1px solid #40516a;
      border-top: 4px solid var(--gold);
      border-radius: 14px;
      padding: clamp(12px, 2.2vw, 28px) 4px;
      min-width: 0;
      box-shadow: 0 10px 28px #00000030;
    }

    .team-name {
      color: var(--gold);
      font-size: clamp(11px, 1.8vw, 23px);
      font-weight: 800;
      white-space: nowrap;
    }

    .score-label {
      color: var(--muted);
      font-size: clamp(9px, 1.2vw, 14px);
      letter-spacing: 0.16em;
      margin-top: 24px;
    }

    .score {
      font-size: clamp(30px, 6vw, 76px);
      line-height: 1.1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 36px;
      color: var(--muted);
      font-size: clamp(10px, 1.2vw, 14px);
      letter-spacing: 0.12em;
    }

    #status {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: normal;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px 6px;
      }

      .teams {
        gap: 4px;
      }

      .team {
        border-radius: 8px;
      }

      .round {
        margin-bottom: 20px;
      }

      .score-label {
        margin-top: 16px;
      }
    }
    .team-leader {
  margin-top: 8px;
  font-size: 16px;
  font-weight: 600;
  color: #ffffff;
}

.team-school {
  margin-top: 4px;
  margin-bottom: 12px;
  font-size: 13px;
  color: #c3ccda;
  line-height: 1.4;
}
    
/* OPTIMASI LIVE SCORE UNTUK LAYAR BESAR */

.team {
  min-width: 0;
  box-sizing: border-box;
}

.team-name {
  font-size: clamp(20px, 2.2vw, 32px);
  font-weight: 800;
  letter-spacing: 1px;
}

.team-leader {
  font-size: clamp(14px, 1.3vw, 20px);
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.team-school {
  font-size: clamp(12px, 1.1vw, 17px);
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.score {
  font-size: clamp(36px, 4.5vw, 64px);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.score-label {
  font-size: clamp(12px, 1vw, 16px);
  letter-spacing: 2px;
}

  </style>
</head>

<body>
  <main class="screen">
    <div class="eyebrow">GRAND FINAL</div>
    <h1>OLYMPIAD MEDSPIN 2026</h1>
    <div class="divider"></div>

    <section class="teams" id="teams" aria-label="Skor lima tim">
      <article class="team">
        <div class="team-name">TIM 1</div>
        <div class="team-leader">Ketua Tim 1</div>
        <div class="team-school">Sekolah Tim 1</div>
        <div class="score-label">SKOR</div>
        <div class="score">0</div>
      </article>
      <article class="team">
        <div class="team-name">TIM 2</div>
        <div class="team-leader">Ketua Tim 2</div>
        <div class="team-school">Sekolah Tim 2</div>
        <div class="score-label">SKOR</div>
        <div class="score">0</div>
      </article>
      <article class="team">
        <div class="team-name">TIM 3</div>
        <div class="team-leader">Ketua Tim 3</div>
        <div class="team-school">Sekolah Tim 3</div>
        <div class="score-label">SKOR</div>
        <div class="score">0</div>
      </article>
      <article class="team">
        <div class="team-name">TIM 4</div>
        <div class="team-leader">Ketua Tim 4</div>
        <div class="team-school">Sekolah Tim 4</div>
        <div class="score-label">SKOR</div>
        <div class="score">0</div>
      </article>
      <article class="team">
        <div class="team-name">TIM 5</div>
        <div class="team-leader">Ketua Tim 5</div>
        <div class="team-school">Sekolah Tim 5</div>
        <div class="score-label">SKOR</div>
        <div class="score">0</div>
      </article>
    </section>

    <footer>LIVE SCORE · OLYMPIAD MEDSPIN 2026</footer>
    <div id="status">Menghubungkan ke server skor...</div>
  </main>

  <script>
    // Ganti URL di bawah dengan URL Web App Apps Script milikmu.
    const API_URL = "https://script.google.com/macros/s/AKfycbwbCx-BgX3VK9X7eVIs0Ds_sGGE8idbpaoI2e2-Mxrw14SIn9hMBLeNQHoIbA5T0Hb-/exec";

    


let requestInProgress = false;
let nextUpdateTimer = null;
let requestTimeout = null;

function updateScores() {
  if (requestInProgress) return;

  requestInProgress = true;

  const status = document.getElementById("status");
  const oldScript = document.getElementById("score-api-script");

  if (oldScript) oldScript.remove();
  if (requestTimeout) clearTimeout(requestTimeout);

  let completed = false;

  function finishRequest(message) {
    if (completed) return;
    completed = true;

    if (requestTimeout) clearTimeout(requestTimeout);
    requestInProgress = false;

    if (message) status.textContent = message;

    nextUpdateTimer = setTimeout(updateScores, 3000);
  }

  window.handleScoreData = function (data) {
    try {
      if (!Array.isArray(data.teams) || data.teams.length !== 5) {
        throw new Error("Format data tim tidak sesuai");
      }

      const cards = document.querySelectorAll(".team");

      data.teams.forEach((team, index) => {
        cards[index].querySelector(".team-name").textContent =
          team.name || ("TIM " + (index + 1));

        const score = Number(team.score);
        cards[index].querySelector(".score").textContent =
          Number.isFinite(score) ? score.toLocaleString("id-ID") : "0";
      });

      finishRequest(
        "Terhubung · Diperbarui " +
        new Date().toLocaleTimeString("id-ID")
      );
    } catch (error) {
      console.error("Gagal membaca skor:", error);
      finishRequest("Format data skor tidak sesuai");
    }
  };

  const script = document.createElement("script");
  script.id = "score-api-script";
  script.src =
    API_URL +
    (API_URL.includes("?") ? "&" : "?") +
    "callback=handleScoreData&t=" + Date.now();

  script.onerror = function () {
    finishRequest("Gagal memuat script API");
  };

  requestTimeout = setTimeout(function () {
    finishRequest("Respons API terlambat · Mencoba kembali");
  }, 15000);

  status.textContent = "Menghubungkan ke API skor...";
  document.body.appendChild(script);
}

updateScores();
</script>
</body>
</html>
